<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robot Push Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">Chargement de Rapier...</div>
  <div id="hud">
    <h1>ROBOT PUSH LAB</h1>
    <div class="stats"><span>Vitesse <b id="speed">0.0</b> m/s</span><span>Caisses restantes <b id="crates">0</b></span><span>Score <b id="score">0</b></span></div>
    <div class="help">ZQSD / flèches : conduire · Espace : coup de bélier · R : remettre le robot · N : nouvelle arène</div>
  </div>
  <div id="mobile">
    <div class="pad"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div>
    <button id="ram">BÉLIER</button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
